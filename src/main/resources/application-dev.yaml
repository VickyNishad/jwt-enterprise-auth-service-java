server:
  port: 8080

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://localhost:3306/enterprise_auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Root@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration


security:
  jwt:
    # 256-bit base64-encoded secret key
    secret-key: 54686973497341566572795365637572654B65795468617449733235364269747321
    access-token-expiration-ms: 900000      # 15 Minutes
    refresh-token-expiration-ms: 604800000  # 7 Days